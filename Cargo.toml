[package]
name = "inputbind"
version = "0.1.0"
edition = "2021"
authors = ["mxmgorin"]
description = "Rebindable input: pad gestures (tap, hold, chord), keyboard combos, gesture capture, and a TOML bindings file"
repository = "https://github.com/mxmgorin/inputbind"

[features]
default = ["sdl2"]
# The SDL2 backend (key names, button/axis translation). The core is
# backend-free: without this, the host supplies its own key-name resolver.
sdl2 = ["dep:sdl2"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
sdl2 = { version = "0.38", default-features = false, optional = true }
